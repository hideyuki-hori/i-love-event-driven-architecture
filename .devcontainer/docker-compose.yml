services:
  app:
    image: mcr.microsoft.com/devcontainers/java:25-bookworm
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    depends_on:
      - cassandra
    networks:
      - app-net

  cassandra:
    image: cassandra:5.0.8
    ports:
      - "9042:9042"
    environment:
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - app-net

networks:
  app-net:
