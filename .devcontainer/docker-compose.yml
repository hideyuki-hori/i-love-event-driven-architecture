services:
  app:
    image: mcr.microsoft.com/devcontainers/java:25-bookworm
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    depends_on:
      - kafka
      - mysql
    networks:
      - kafka-net

  kafka:
    image: apache/kafka:4.3.0
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 15s
    networks:
      - kafka-net

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: local-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
    networks:
      - kafka-net

  schema-registry:
    image: confluentinc/cp-schema-registry:8.2.1
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
    networks:
      - kafka-net

  connect:
    image: apache/kafka:4.3.0
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_started
      schema-registry:
        condition: service_started
    ports:
      - "8083:8083"
    volumes:
      - ./connect-distributed.properties:/opt/kafka/config/connect-distributed.properties
    command:
      - bash
      - -c
      - |
        mkdir -p /opt/kafka/plugins
        if [ ! -d /opt/kafka/plugins/debezium-connector-mysql ]; then
          wget -q -O /tmp/dbz.tgz https://repo1.maven.org/maven2/io/debezium/debezium-connector-mysql/3.5.2.Final/debezium-connector-mysql-3.5.2.Final-plugin.tar.gz
          tar -xzf /tmp/dbz.tgz -C /opt/kafka/plugins
        fi
        if [ ! -d /opt/kafka/plugins/confluentinc-kafka-connect-avro-converter-8.2.1 ]; then
          wget -q -O /tmp/avro.zip https://hub-downloads.confluent.io/api/plugins/confluentinc/kafka-connect-avro-converter/versions/8.2.1/confluentinc-kafka-connect-avro-converter-8.2.1.zip
          unzip -q /tmp/avro.zip -d /opt/kafka/plugins
        fi
        exec /opt/kafka/bin/connect-distributed.sh /opt/kafka/config/connect-distributed.properties
    networks:
      - kafka-net

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appdb
      MYSQL_USER: dbz
      MYSQL_PASSWORD: dbz
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql
    networks:
      - kafka-net

  jobmanager:
    image: flink:2.2.1-java21
    ports:
      - "8082:8081"
    command: jobmanager
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
    volumes:
      - ..:/workspace:cached
    networks:
      - kafka-net

  taskmanager:
    image: flink:2.2.1-java21
    command: taskmanager
    depends_on:
      - jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
    networks:
      - kafka-net

networks:
  kafka-net:

volumes:
  kafka-data:
  mysql-data:
